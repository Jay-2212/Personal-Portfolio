<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page not found — Jay Bharti</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #b8b2a6;
      background: #0f0f0f;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      line-height: 1.65;
    }
    main { width: min(100%, 560px); }
    .code {
      margin: 0 0 12px;
      color: #c9a84c;
      font: 13px/1.5 "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.12em;
    }
    h1 {
      margin: 0;
      color: #faf7f0;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.1;
    }
    p { margin: 16px 0 24px; }
    a { color: #c9a84c; text-decoration: none; }
    a:hover { color: #d4b65e; text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 · NOT FOUND</p>
    <h1>Page not found</h1>
    <p>This page may have moved or the address may be incorrect.</p>
    <a href="/">Return to the portfolio</a>
  </main>
</body>
</html>
